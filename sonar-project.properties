# SonarCloud (análise estática de qualidade e segurança) — executada pelo job "sonar" do CI.
# Substitua sonar.organization e sonar.projectKey pelos valores que o SonarCloud mostra ao importar o repositório.
sonar.organization=dc811cunha
sonar.projectKey=DC811cunha_metrologia-software
sonar.projectName=SoftMeter

sonar.sources=src/backend/app,src/frontend/src
sonar.tests=src/backend/tests,src/frontend/src
sonar.test.inclusions=src/backend/tests/**,src/frontend/src/**/*.test.ts,src/frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/backend/alembic/**,**/*.test.ts,**/*.test.tsx

# Cobertura gerada pelos jobs de testes (pytest-cov em XML e Jest em lcov)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=src/backend/coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
