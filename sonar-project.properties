# SonarCloud (análise estática de qualidade e segurança) — executada pelo job "sonar" do CI.
# Organização e chave do projeto conferidas no SonarQube Cloud (projeto importado em 19/11/2026).
sonar.organization=dc811cunha
sonar.projectKey=DC811cunha_metrologia-software
sonar.projectName=SoftMeter

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/backend/alembic/**,**/*.test.ts,**/*.test.tsx,docs/archive/**,.claude/**,.specify/**

# Cobertura gerada pelos jobs de testes (pytest-cov em XML e Jest em lcov)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=src/backend/coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
