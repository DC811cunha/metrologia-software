# SoftMeter — compose de PRODUÇÃO (Caddy + frontend, backend, worker, Postgres e Redis).
#
# Diferenças em relação ao docker-compose.yml (desenvolvimento):
#   - só o Caddy (`web`) publica portas no host (80/443): Postgres, Redis e a API só são alcançáveis pela rede interna;
#   - o Caddy serve o build estático do frontend e encaminha /api e /health ao backend, com HTTPS automático
#     (Let's Encrypt) — site e API no mesmo domínio (cookie SameSite=Lax);
#   - Redis exige senha;
#   - sem `--reload` e sem o código montado como volume;
#   - toda credencial é obrigatória: o compose recusa subir se alguma variável faltar.
#
# Atualizar no servidor: ./scripts/deploy.sh. Passo a passo: docs/deploy/roteiro-deploy-aws.md.
# O `name` separa este projeto do compose de desenvolvimento (mesmos nomes de serviço, outros volumes).

name: softmeter-prod

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql://${DB_USER:-softmeter}:${DB_PASSWORD:?defina DB_PASSWORD}@db:5432/${DB_NAME:-softmeter_db}
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (>= 32 caracteres)}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET (>= 32 caracteres, diferente de JWT_SECRET)}
  COOKIE_SECURE: "true"
  RATE_LIMIT_BACKEND: redis
  CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS como lista JSON das origens permitidas}
  FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL com a URL publica do site}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-SoftMeter <onboarding@resend.dev>}
  PASSWORD_RESET_TOKEN_EXPIRES_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRES_MINUTES:-60}
  # PDFs dos relatórios: diretório absoluto, montado em um volume nomeado (ver o serviço backend).
  REPORTS_DIR: /app/generated_reports

services:
  db:
    image: postgres:16-alpine
    container_name: softmeter_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-softmeter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-softmeter_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-softmeter} -d ${DB_NAME:-softmeter_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: softmeter_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: prod
    container_name: softmeter_backend_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      # IPs do proxy reverso em que o backend confia para ler X-Forwarded-For (o uvicorn lê esta
      # variável). Sem isto, atrás de um proxy todos os usuários apareceriam com o IP do proxy.
      # A API só é alcançável pela rede do compose (sem porta publicada): o único cliente é o Caddy. A sub-rede é fixa
      # (ver `networks` abaixo), então o padrão já está correto; só mude se mudar a sub-rede.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.29.0.0/24}
    volumes:
      # Sem este volume os PDFs moravam no sistema de arquivos do container e sumiam a cada recriação
      # (deploy, atualização de imagem): todo relatório já emitido passava a dar 404.
      - reports_data_prod:/app/generated_reports
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3001", "--proxy-headers"]

  web:
    # Caddy com o build estático do frontend (estágio `prod` do Dockerfile). `VITE_API_URL` vazio = mesma origem.
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ""
    container_name: softmeter_web_prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Domínio público (ex.: softmeter.com.br). Com `localhost` o Caddy usa um certificado interno (teste local).
      SITE_ADDRESS: "${SITE_ADDRESS:?defina SITE_ADDRESS com o dominio publico, ex. softmeter.com.br}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  celery-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: prod
    container_name: softmeter_celery_worker_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]

networks:
  default:
    # Sub-rede fixa: o uvicorn só confia no X-Forwarded-For vindo daqui (FORWARDED_ALLOW_IPS).
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  postgres_data_prod:
  reports_data_prod:
  # Certificados do Caddy: se este volume se perder, o Let's Encrypt emite outros (com limite de emissões por semana).
  caddy_data:
  caddy_config:
