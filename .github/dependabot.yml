# Atualizações semanais de dependências: cada grupo vira um PR (que passa pelo CI antes de qualquer merge).
# Segurança: os alertas do GitHub continuam gerando PRs imediatos, independentemente deste calendário.
version: 2
updates:
  - package-ecosystem: pip
    directory: /src/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # babel-jest 30.5+ puxa glob/minimatch com avisos de segurança (dev) e deixaria o `npm audit` com 6 itens;
      # reavaliar quando eles forem corrigidos.
      - dependency-name: babel-jest
        versions: [">=30.5.0"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/backend
    schedule:
      interval: weekly
