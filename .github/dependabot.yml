# Atualizações semanais de dependências: cada grupo vira um PR (que passa pelo CI antes de qualquer merge).
# Segurança: os alertas do GitHub continuam gerando PRs imediatos, independentemente deste calendário.
version: 2
updates:
  - package-ecosystem: pip
    directory: /src/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Fora dos limites que o projeto aceita hoje (avaliado em 18/11/2026):
      - dependency-name: sqlalchemy        # pyproject.toml limita a <2.1 (a 2.1 quebrou o driver psycopg no CI)
        versions: [">=2.1"]
      - dependency-name: mando             # radon 6 exige mando<0.8
        versions: [">=0.8"]
      - dependency-name: python-dateutil   # dependência indireta (celery/kombu): o resolvedor do pip decide

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # babel-jest 30.5+ puxa glob/minimatch com avisos de segurança (dev) e deixaria o `npm audit` com 6 itens;
      # reavaliar quando eles forem corrigidos.
      - dependency-name: babel-jest
        versions: [">=30.5.0"]
      # Jest 30 traz glob/minimatch com avisos de segurança (dev): `npm audit` sairia de 0 para 10-18 itens
      # moderados mesmo na 30.4. Ficamos no Jest 29 até isso ser corrigido.
      - dependency-name: jest
        versions: [">=30.0.0"]
      - dependency-name: "@types/jest"
        versions: [">=30.0.0"]
      # O ambiente do Jest deve ter a mesma versão principal do Jest (hoje 29): o jsdom-env 30 passa nos testes, mas é uma
      # combinação sem suporte. Subir junto com o Jest 30.
      - dependency-name: jest-environment-jsdom
        versions: [">=30.0.0"]
      # Babel 8 precisa subir inteiro (core + preset-env + preset-react + preset-typescript); atualizações isoladas deixam os
      # presets 7 com dependência de par inválida, e só serve à transpilação dos testes. Reavaliar em um PR único.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/preset-env"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/preset-react"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/preset-typescript"
        versions: [">=8.0.0"]
      # recharts 3: o CI passa, mas as faixas ReferenceArea/ReferenceLine do TrendChart passam a capturar o mouse e o tooltip, o
      # cursor e o ponto ativo deixam de aparecer. Correção testada: style={{ pointerEvents: 'none' }} nessas faixas. Migrar
      # depois da entrega, com a suíte E2E completa.
      - dependency-name: recharts
        versions: [">=3.0.0"]
      # React 19 fica para depois da entrega: exige subir react, react-dom, @types/react e @types/react-dom juntos (o PR
      # isolado falha com ERESOLVE) e rever as bibliotecas que dependem do React 18.
      - dependency-name: react
        versions: [">=19.0.0"]
      - dependency-name: react-dom
        versions: [">=19.0.0"]
      - dependency-name: "@types/react"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.0.0"]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/backend
    schedule:
      interval: weekly
