name: Deploy — SoftMeter (AWS)

# Entrega contínua: depois que o CI passa na `main`, este fluxo manda o servidor da AWS atualizar a aplicação.
# Não há SSH: o acesso é pelo AWS Systems Manager (SSM), com uma chave de acesso de privilégio mínimo:
#   1. o usuário IAM `softmeter-github-deploy` (sem acesso ao console) só pode mandar comandos (SSM) para a instância
#      de produção — não cria recursos nem gera cobrança;
#   2. a chave fica em segredos do *environment* `production` do GitHub, que só libera a `main`;
#   3. na instância roda `scripts/deploy.sh` (git pull, build, migrations, up -d, teste de /health).
# O OIDC (token temporário, sem chave fixa) seria preferível, mas exige os "recursos avançados" da AWS, que pedem o
# upgrade da conta e um cartão de pagamento: ver ADR-016. Configuração: docs/deploy/roteiro-deploy-aws.md (seção 12).

on:
  workflow_run:
    workflows: ["CI — SoftMeter"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; um novo espera o anterior terminar (não interrompe um deploy no meio).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy — produção
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Só depois de um CI verde na main (ou quando disparado à mão).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Os segredos e as variáveis abaixo ficam neste environment (Settings > Environments), restrito à `main`.
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Conferir a configuração
        run: |
          for v in AWS_REGION INSTANCE_ID; do
            if [ -z "${!v}" ]; then echo "::error::Defina a variável do environment production correspondente a $v (ver o roteiro de deploy, seção 12)."; exit 1; fi
          done
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Defina o segredo $v no environment production (ver o roteiro de deploy, seção 12)."; exit 1; fi
          done

      - name: Credenciais da AWS (usuário de deploy com privilégio mínimo)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Atualizar a aplicação no servidor (AWS Systems Manager)
        run: |
          set -euo pipefail
          COMMENT="deploy ${GITHUB_SHA::7}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "$COMMENT" \
            --timeout-seconds 3000 \
            --parameters 'commands=["cd /opt/softmeter && ./scripts/deploy.sh"],executionTimeout=["2400"]' \
            --query "Command.CommandId" --output text)
          echo "Comando enviado: $CMD_ID"

          # O deploy reconstrói imagens (alguns minutos): consulta o estado a cada 10 s, por até 40 min.
          status="Pending"
          for _ in $(seq 1 240); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
          done

          echo "::group::Saída do deploy"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "::endgroup::"
          errors=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true)
          if [ -n "$errors" ] && [ "$errors" != "None" ]; then
            echo "::group::Erros do deploy"; echo "$errors"; echo "::endgroup::"
          fi

          if [ "$status" != "Success" ]; then
            echo "::error::O deploy terminou com o estado: $status"
            exit 1
          fi
          echo "Deploy concluído."
