name: CI — SoftMeter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint + Tipos + Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: softmeter
          POSTGRES_PASSWORD: softmeter123
          POSTGRES_DB: softmeter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        working-directory: src/backend
        run: pip install -c requirements.txt -e ".[dev]"

      - name: Lint (ruff)
        working-directory: src/backend
        run: ruff check .

      - name: Type-check (mypy)
        working-directory: src/backend
        run: mypy app

      - name: Testes com cobertura
        working-directory: src/backend
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
        env:
          DATABASE_URL: postgresql://softmeter:softmeter123@localhost:5432/softmeter_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_key
          JWT_REFRESH_SECRET: test_refresh_secret_key

      - name: Upload cobertura
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: src/backend/coverage.xml

  frontend:
    name: Frontend — Lint + Tipos + Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: src/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: src/frontend
        run: npm run lint

      - name: Type-check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Testes com cobertura
        working-directory: src/frontend
        run: npm test -- --coverage

      # O build não fazia parte do CI: uma atualização que quebra o Vite/Tailwind/PostCSS (ex.: Tailwind 4, que
      # exige outro plugin) passava verde e só aparecia ao subir a aplicação.
      - name: Build de produção
        working-directory: src/frontend
        run: npm run build

      - name: Upload cobertura
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/frontend/coverage/

  # O que roda em produção é a imagem do estágio `prod` (só as dependências de execução, sem as de teste). Uma
  # dependência que só o pytest trazia (ex.: `packaging`, exigido pelo kombu) passava no CI e derrubava o worker
  # ao subir em produção. Aqui a imagem é construída e os módulos que o worker e a API carregam são importados.
  prod-image:
    name: Produção — imagem do backend e compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Construir a imagem de produção do backend
        run: docker build --target prod -t softmeter-backend-prod src/backend

      - name: Importar os módulos do worker e da API na imagem de produção
        run: >-
          docker run --rm softmeter-backend-prod python -c
          "import app.main, app.core.celery_app, app.workers.analysis_tasks, app.workers.auth_tasks,
          app.workers.email_tasks, kombu.transport.redis; print('ok')"

      - name: Validar o docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          SITE_ADDRESS: exemplo.com.br
          DB_PASSWORD: x
          REDIS_PASSWORD: x
          JWT_SECRET: x
          JWT_REFRESH_SECRET: y
          CORS_ORIGINS: '["https://exemplo.com.br"]'
          FRONTEND_URL: https://exemplo.com.br

  # Análise estática de qualidade e segurança (SonarCloud). Reaproveita a cobertura dos jobs de testes. Só roda
  # quando o segredo SONAR_TOKEN existe (PRs do Dependabot e de forks não o recebem e não devem falhar por isso).
  sonar:
    name: Qualidade — SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o SonarCloud precisa do histórico completo para atribuir problemas novos

      - name: Baixar a cobertura do backend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: src/backend

      - name: Baixar a cobertura do frontend
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: src/frontend/coverage

      # O lcov.info traz os caminhos relativos a src/frontend (ex.: src/App.tsx); o SonarCloud os resolve a partir da raiz do
      # repositório. O coverage.xml não precisa de ajuste: o SonarCloud o resolve pelo <source> do próprio relatório.
      - name: Ajustar os caminhos da cobertura do frontend
        if: env.SONAR_TOKEN != ''
        run: sed -i 's|^SF:|SF:src/frontend/|' src/frontend/coverage/lcov.info

      - name: Análise do SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
